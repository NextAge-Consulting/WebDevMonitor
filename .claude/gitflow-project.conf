# gitflow project integration configuration.
#
# Sourced by issue_helpers.sh. Controls how /work, /commit, /ship-main,
# /open-pr and /deploy move issues across the GitHub Project board. PROJECT_ID
# empty = no board: issue links, the code-complete question and the
# `Closes #N` lines all still work, nothing touches a board. The kit ships
# this file with empty subs (no board by default).
#
# ─── Lifecycle and trigger map ────────────────────────────────────────────
#   In Progress → /work <N[,N…]>                     (move_issue_to_in_progress)
#   Staged      → /commit or /ship-main, for each issue
#                 answered code complete; /open-pr
#                 for every linked issue             (move_issue_to_staged)
#   deploy      → /deploy (post-tag-push), for every
#                 issue named by `Closes #N` since
#                 the last tag                       (move_issue_to_deployed)
#
# The deploy status is whatever the project calls that column — Done,
# Deployed, anything. /merge does not transition.
#
# Nothing here decides whether an issue CLOSES. That is GitHub configuration:
# the repository's "Auto-close issues with merged linked pull requests"
# setting, and the board's "Auto-close issue" workflow — see
# project-documentation/github-project-board-setup.md in the dev kit.
#
# With PROJECT_ID set, all four IDs below are required: an empty one fails the
# command that needs it, loudly, rather than skipping.
#
# Failure semantics — see issue_helpers.sh header. Short version:
# PROJECT_ID empty = silent skip. PROJECT_ID set + any other ID missing or
# the GraphQL call failing = ERROR + script exits non-zero. Retry after
# fixing the cause.
#
# ─── How to enable for a new project ──────────────────────────────────────
# Values are supplied via `.claude/sync-substitutions.json`, NOT by editing
# this file directly. /sync-dev-kit substitutes the {{KEY}} markers
# below from the substitutions file on apply.
#
# 1. PROJECT_ID — run (replace <ORG> with your org or user):
#      gh api graphql -f query='{ organization(login:"<ORG>") { projectsV2(first:10) { nodes { id title } } } }'
#    (Or for user-owned projects: substitute `user(login:"<USER>")` for `organization(login:"<ORG>")`.)
#    Copy the `id` of the project you want to target.
#
# 2. STATUS_FIELD_ID + the three option IDs — one query fetches them all:
#      gh api graphql -f query='{ node(id:"<PROJECT_ID>") { ... on ProjectV2 { fields(first:20) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } }'
#    From the output:
#      - The Status field's `id`              → GITFLOW_STATUS_FIELD_ID
#      - "In Progress" option's `id`          → GITFLOW_STATUS_IN_PROGRESS_ID
#      - "Staged" option's `id`               → GITFLOW_STATUS_STAGED_ID
#      - the deploy column's option `id`      → GITFLOW_STATUS_DEPLOYED_ID
#
# 3. Set the five values in `.claude/sync-substitutions.json`. Commit the
#    substitutions file. Next /sync-dev-kit resolves the {{KEY}}
#    placeholders below into real IDs on disk. To disable the entire
#    feature: set GITFLOW_PROJECT_ID back to empty string and re-sync.
# ────────────────────────────────────────────────────────────────────────────

# GraphQL node ID of the project to track issues in (empty = feature disabled)
GITFLOW_PROJECT_ID=""

# GraphQL field ID of the Status single-select field on that project
GITFLOW_STATUS_FIELD_ID=""

# GraphQL option ID for "In Progress" — set by /work
GITFLOW_STATUS_IN_PROGRESS_ID=""

# GraphQL option ID for "Staged" — code complete, waiting for deployment
GITFLOW_STATUS_STAGED_ID=""

# GraphQL option ID for the column /deploy sets after tag push — any name
GITFLOW_STATUS_DEPLOYED_ID=""
